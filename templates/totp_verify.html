<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-factor · {{ branding.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%); min-height: 100vh; display: flex; align-items: center; }
    .card { max-width: 420px; width: 100%; padding: 2rem; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.35); border: 0; }
    input.code { font-size: 26px; letter-spacing: .35em; text-align: center; font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
<div class="container d-flex justify-content-center">
  <div class="card">
    <h5 class="mb-1">Two-factor authentication</h5>
    <p class="text-muted small">Enter the 6-digit code from your authenticator app for <code>{{ username }}</code>.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for cat, msg in messages %}
        <div class="alert alert-{{ 'danger' if cat=='danger' else cat }}">{{ msg }}</div>
      {% endfor %}{% endif %}
    {% endwith %}
    <form method="post">
      <input class="form-control code mb-3" type="text" name="code" autocomplete="one-time-code"
             inputmode="numeric" pattern="[0-9]*" required autofocus maxlength="7">
      <button class="btn btn-primary w-100" type="submit">Verify</button>
    </form>
    <div class="text-center mt-3">
      <a href="{{ url_for('auth.login') }}" class="small">← Back to sign in</a>
    </div>
  </div>
</div>
</body>
</html>
