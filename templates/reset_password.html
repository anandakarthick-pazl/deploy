<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · {{ branding.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%); min-height: 100vh; display: flex; align-items: center; }
    .card { max-width: 460px; width: 100%; padding: 2rem; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.35); border: 0; }
    .brand-row { display:flex;align-items:center;gap:.6rem;margin-bottom:1.4rem;color:#1d3557;font-weight:600;font-size:1.2rem; }
    .brand-row img { max-height: 36px; }
  </style>
</head>
<body>
<div class="container d-flex justify-content-center">
  <div class="card">
    <div class="brand-row">
      {% if branding.logo %}<img src="{{ url_for('static', filename=branding.logo) }}" alt="">{% endif %}
      <span>{{ branding.name }}</span>
    </div>
    <h5>Choose a new password</h5>
    <p class="text-muted small">Setting the password for <code>{{ username }}</code>.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}<div class="alert alert-{{ 'danger' if cat=='danger' else cat }}">{{ msg }}</div>{% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label">New password (min 8 chars)</label>
        <input class="form-control" type="password" name="password" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input class="form-control" type="password" name="password_confirm" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Set password & sign in</button>
    </form>
  </div>
</div>
</body>
</html>
