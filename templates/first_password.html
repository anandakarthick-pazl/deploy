<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set password · Packwork Deploy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%); min-height: 100vh; display: flex; align-items: center; }
    .card { max-width: 440px; width: 100%; padding: 2rem; border-radius: 14px;
            box-shadow: 0 18px 50px rgba(0,0,0,.35); border: 0; }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div class="card">
      <h4 class="mb-1">Set your password</h4>
      <p class="text-muted">First-time login for <code>{{ username }}</code>. Choose a password to use from now on.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{ 'danger' if cat=='danger' else cat }}">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <div class="mb-3">
          <label class="form-label">New password (min 8 chars)</label>
          <input class="form-control" type="password" name="password" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm password</label>
          <input class="form-control" type="password" name="password_confirm" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Set password & sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
