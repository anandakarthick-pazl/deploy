<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ branding.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { max-width: 420px; width: 100%; background: white; border-radius: 14px;
                  box-shadow: 0 18px 50px rgba(0,0,0,.35); padding: 2.2rem 2rem; }
    .brand { display: flex; align-items: center; gap: .5rem; color: #1d3557; font-weight: 600;
             font-size: 1.4rem; margin-bottom: 1.4rem; }
    .brand i { color: #0d6efd; font-size: 1.8rem; }
    .brand img { max-height: 44px; max-width: 100%; }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div class="login-card">
      <div class="brand">
        {% if branding.logo %}
          <img src="{{ url_for('static', filename=branding.logo) }}" alt="">
        {% else %}
          <i class="bi bi-cloud-arrow-up-fill"></i>
        {% endif %}
        <span>{{ branding.name }}</span>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{ 'danger' if cat=='danger' else cat }}">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" autocomplete="on">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" name="username" autofocus required value="{{ request.form.get('username','') }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('auth.forgot_password') }}" class="small text-muted">Forgot your password?</a>
      </div>
    </div>
  </div>
</body>
</html>
